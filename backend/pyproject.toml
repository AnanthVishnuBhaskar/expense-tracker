[project]
name = "expense-tracker-backend"
version = "0.1.0"
description = "Receipt OCR expense tracker API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "babel>=2.18.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
